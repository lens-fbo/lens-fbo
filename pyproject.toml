[project]
name = "fbo"
version = "0.1.0"
description = "Bayesian optimization over function spaces with a learned surrogate geometry"
readme = "README.md"
requires-python = ">=3.12,<3.14"   # torch 2.6.0 has wheels for 3.9 to 3.13 only
dependencies = [
    "bofus",
    "jax>=0.9.2",
    "equinox>=0.13.6",
    "jaxtyping>=0.3.9",
    "numpy>=2.4.4",
    "scipy>=1.17.1",
    "pandas>=3.0.2",
    "pyarrow>=25.0.0",
    "matplotlib>=3.10.8",
    # bofus loads MNIST through torchvision; no torch code runs otherwise
    "torch",
    "torchvision",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["uv_build>=0.10.2,<0.12"]
build-backend = "uv_build"

[tool.uv]
# bofus asks for torchvision>=0.26; the experiments ran 0.21, which reads MNIST the same way
override-dependencies = ["torchvision>=0.21"]
# every package but torch and its own dependencies at the version of the source's lockfile
# (bofus@submission uv.lock), so the benchmarks and the baseline run on the software the
# source's numbers came from
constraint-dependencies = [
    # torch at the version the experiments ran
    "torch==2.6.0",
    "torchvision==0.21.0",
    "absl-py==2.4.0",
    "appnope==0.1.4",
    "asttokens==3.0.1",
    "cffi==2.0.0",
    "cloudpickle==3.1.2",
    "colorama==0.4.6",
    "comm==0.2.3",
    "contourpy==1.3.3",
    "cycler==0.12.1",
    "debugpy==1.8.20",
    "decorator==5.2.1",
    "einops==0.8.2",
    "equinox==0.13.6",
    "executing==2.2.1",
    "farama-notifications==0.0.4",
    "fonttools==4.62.1",
    "gymnasium==1.2.3",
    "ipykernel==7.2.0",
    "ipython-pygments-lexers==1.1.1",
    "ipython==9.13.0",
    "jax==0.9.2",
    "jaxlib==0.9.2",
    "jaxtyping==0.3.9",
    "jaxvlse==0.0.0",
    "jedi==0.19.2",
    "joblib==1.5.3",
    "jupyter-client==8.8.0",
    "jupyter-core==5.9.1",
    "kiwisolver==1.5.0",
    "matplotlib-inline==0.2.1",
    "matplotlib==3.10.8",
    "ml-dtypes==0.5.4",
    "nest-asyncio==1.6.0",
    "numpy==2.4.4",
    "opt-einsum==3.4.0",
    "optax==0.2.8",
    "packaging==26.1",
    "pandas==3.0.2",
    "parso==0.8.6",
    "patsy==1.0.2",
    "pexpect==4.9.0",
    "platformdirs==4.9.6",
    "prompt-toolkit==3.0.52",
    "psutil==7.2.2",
    "ptyprocess==0.7.0",
    "pure-eval==0.2.3",
    "pyarrow==25.0.0",
    "pycparser==3.0",
    "pygments==2.20.0",
    "pyparsing==3.3.2",
    "python-dateutil==2.9.0.post0",
    "pyzmq==27.1.0",
    "scipy==1.17.1",
    "six==1.17.0",
    "stack-data==0.6.3",
    "statsmodels==0.14.6",
    "tornado==6.5.5",
    "tqdm==4.67.3",
    "traitlets==5.14.3",
    "typing-extensions==4.15.0",
    "tzdata==2026.1",
    "wadler-lindig==0.1.7",
    "wcwidth==0.6.0",
]

[tool.uv.sources]
bofus = { path = "third_party/bofus", editable = true }
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
